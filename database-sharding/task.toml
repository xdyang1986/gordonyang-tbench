[task]
name = "codimango/database-sharding"
description = "Hard multi-turn Go sharding proxy. Turn1 27 tests trimmed from 45 warm-up to discriminator-focused: weighted MD5 big-endian totalWeight, global broadcast -1 and comma-separated sorted, checksum sorted keys no spaces no HTML escaping, config validation duplicate id weight<=0 no stdout unknown command missing key, corruption backup .corrupt.<nanosec> warning, self-healing set cleans wrong shard delete cleans all, large 100KB, distribution zeros global, list-keys sorted exact, ops.log version shard_id ts skips invalid warning, raw-string full table 123abc->string {a:1} x->string nullx->string [1,2->string whitespace trimmed number 7 (Go trap streaming vs full), help version checksum staging weight global ops.log. Turn2 73 tests b1bce20 shipped staging two-phase + ts-sorted: versioned shard_id version data checksum where shard_id must match expected version increments old+1, checksum no HTML escaping, corruption handling shard_id mismatch missing version negative version missing checksum mismatch backup .corrupt.<nanosec> warning, fallback legacy, duplicate/wrong-shard cleanup only correct weighted retains non-global global replicated, migration staging dir /app/data/staging two-phase + ts-sorted replay ascending ts stable for ties (abstract no v1/v2/100/50 walkthrough), dry-run backup tightening .bak and ops.log.bak, version exact increment, distribution global after migration, large 100KB, empty valid MD5 d41d8cd98f00b204e9800998ecf8427e empty legacy still cleanup, unknown command missing args, help version shard_id checksum staging timestamp ts, inherit_prior_session true, pooled calibration ±20pp noise note."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "database", "sharding", "proxy", "migration", "weighted", "broadcast", "checksum"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

