eight,global,ops.log,dry-run,backup,force,version,shard_id,checksum,staging,timestamp,ts and migrate --help must contain dry-run,backup,force,version,shard_id,staging,timestamp, stdlib only, atomic CreateTemp+Rename grouped batched writes map[int] staging, bufio.Scanner large buffer."
