schema_version = "1.1"

[task]
name = "codimango/database-sharding"
description = "Hard single-turn Go sharding proxy migration: weighted MD5 big-endian routing with global broadcast (-1 and comma-separated id-sorted), checksum integrity without HTML escaping, corruption backup with warning and repair, fallback to legacy, duplicate/wrong-shard cleanup, batched atomic writes per shard with staging dir durable byte-equal to final shards, ts-sorted ops.log replay stable ties, versioned integrity shard_id+version+checksum, preserve vs force with Overwriting log, dry-run plan, backup tightening .bak, 1MB+ handling, empty string valid key, help for commands and migrate flags, config validation."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "database", "sharding", "proxy", "migration", "weighted", "broadcast", "checksum"]
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "hard"
category = "software-engineering"
category_usecase = "migration"
category_subdomain = "distributed_systems"
tags = ["iterate_on_feature", "database", "sharding", "proxy", "migration", "golang", "distributed-systems", "weighted", "broadcast"]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"
expert_time_estimate_min = 70
junior_time_estimate_min = 130
languages = ["go"]

