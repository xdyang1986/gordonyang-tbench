schema_version = "1.1"

[task]
name = "codimango/database-sharding"
description = "Hard single-turn Go sharding proxy migration. Turn1 proxy (weighted MD5 big-endian totalWeight, global broadcast -1/comma-separated sorted, checksum no HTML escaping, corruption backup, self-healing, ops.log, raw-string single invariant full JSON consumption, inotify atomic) is pre-built in Dockerfile to fix step-0 1.0 saturation (43/43 originally, every clean run gate failed needing 3+ steps exemption; two prior passing runs were infra flakes dropping Turn1 to 0.9). Grading is migration only (81 tests): versioned integrity shard_id+version+checksum, corruption handling shard_id mismatch/missing version/negative version/missing checksum/mismatch with .corrupt.<nanosec> backup+warning, fallback legacy (weighted then legacy, global id-order first-found then legacy), duplicate/wrong-shard cleanup only correct weighted retains non-global global replicated to all, weighted routing same as Turn1, batched atomic writes per shard + staging durable+byte-equal no ordering (reworded from ordering to durable atomic final writes plus byte-equal staged artifacts, fixes inotify breaks when staging dir recreated and ptrace amd64-only), ts-sorted ops.log replay ascending ts stable ties, version old+1, preserve vs force with Overwriting log accepted on either stream, dry-run plan mentions cleanup/version/shard_id no mods, backup tightening .bak and ops.log.bak, 1MB+ via legacy, large 100KB, empty legacy still triggers cleanup/replay, empty string valid MD5 d41d8cd98f00b204e9800998ecf8427e, help top-level names commands (get-shard-id/set/get/delete/list-keys/distribution/migrate) not subcommand flags, migrate --help names dry-run/backup/force, unknown command/bad config exit 2 no stdout, custom --ops-log exercised, post-subcommand flags (migrate --config ...) exercised, global get-shard-path comma-separated id-sorted, global get picks first id-order on conflict, missing/invalid config-file, empty shard lists, exact ops.log count global set/delete now 1 per spec singular line with shard_id -1 (fixed oracle previously logging per shard). Under-specified Turn1&2 to fix EASY saturation (removed raw-string table, weighted example Hash%5 mapping, Success exhaustive restatement, Turn2 checklist detail, calibration notes at lines 7,74,129 and source-inspection promises). Staging test fixed to use default CONFIG_PATH where /app/data/staging is both literal and shard-adjacent, raw bytes comparison, picks shard legacy key routes to."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "database", "sharding", "proxy", "migration", "weighted", "broadcast", "checksum"]
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"

