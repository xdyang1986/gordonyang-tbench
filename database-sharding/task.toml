description = "Hard Go multi-turn sharding proxy: Turn1 requires weighted MD5 sharding (weights per shard), global: broadcast keys replication, transaction log ops.log with integrity, checksum file format without HTML escaping, config validation exit 2 no stdout, corruption backup .corrupt.<timestamp>, sorted list-keys, distribution including zeros, empty string '' is valid key MD5 d41d8cd98f00b204e9800998ecf8427e7. Turn2 HARD enhanced v2 (69 tests): upgrade to versioned integrity {shard_id, version, data, checksum} where shard_id must match config, version increments on each set/delete/migration/replay, checksum without HTML escaping, corruption handling for shard_id mismatch/missing version/negative version/missing checksum/checksum mismatch with backup .corrupt.<nanosec> and stderr warning containing corrupt/checksum/shard_id/version, fallback to legacy, duplicate/misplaced detection and cleanup (only correct weighted shard retains non-global, global replicated to all), migration with dry-run mentioning version/shard_id/checksum/cleanup, backup tightening legacy .bak + each modified shard .bak + ops.log.bak with content check, force overwrite stderr logging, corrupted shard handling during migration, ops.log replay TIMESTAMP-SORTED by ts ascending stable file-order tie-breaker with version field and global replication tombstone delete handling (out-of-order file vs ts must make later ts win), large 100KB+ value atomic, empty string '' in list-keys sorted first, unknown command exit 2, missing key args exit 2 no stdout, config validation for duplicate id, empty path, negative id, id>=count, missing shard_count, weight<=0 with no stdout, help explicit bare no-args containing get-shard-id,set,get,delete,list-keys,distribution,migrate,config,legacy,weight,global,ops.log,dry-run,backup,force,version,shard_id,checksum and migrate --help containing dry-run,backup,force,version,shard_id, stdlib only, atomic CreateTemp+Rename, grouped batched writes, bufio.Scanner with large buffer."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
