schema_version = "1.1"

[task]
name = "codimango/database-sharding"
description = "Hard multi-turn Go sharding proxy. Turn1 HARD v3 62 tests after removing empty ambiguous (silent on empty, not tested): weighted MD5 big-endian, global broadcast -1 and comma-separated sorted, checksum without HTML escaping SetEscapeHTML false sorted keys no spaces, config validation duplicate id empty path negative id id>=count weight<=0 missing shard_count invalid json missing file no stdout unknown command missing key arg, corruption backup .corrupt.<nanosec> warning corrupt/checksum, self-healing set cleans wrong shard duplicates delete cleans all shards, large 100KB value atomic CreateTemp+Rename+SetEscapeHTML, distribution zeros and global counts, list-keys sorted exact with global, ops.log with version shard_id ts big buffer 10MB skips invalid warning, help bare must contain version,checksum,staging. Turn2 HARD easier v5 62 tests (down from 83 too hard): versioned {shard_id,version,data,checksum} shard_id must match config version increments, checksum no HTML escaping, corruption shard_id mismatch/missing version/negative version/missing checksum/checksum mismatch backup .corrupt.<nanosec> warning, fallback legacy, duplicate/misplaced cleanup only correct weighted shard retains non-global global replicated to all, migration dry-run backup tightening legacy .bak + each modified shard .bak + ops.log.bak, force overwrite stderr, file-order ops.log replay (no ts-sorted to ease), no staging dir, no self-healing set/delete tricky, no large ops.log buffer tricky, large 100KB value, empty valid MD5 d41d8, unknown command exit 2 missing key args exit 2 no stdout, help must contain version,shard_id,checksum,dry-run,backup,force."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "database", "sharding", "proxy", "migration", "weighted", "broadcast", "checksum"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "hard"
category = "software-engineering"
category_usecase = "migration"
category_subdomain = "distributed_systems"
tags = ["iterate_on_feature", "database", "sharding", "proxy", "migration", "golang", "distributed-systems", "weighted", "broadcast"]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"
expert_time_estimate_min = 70
junior_time_estimate_min = 130
languages = ["go"]

