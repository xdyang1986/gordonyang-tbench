schema_version = "1.1"

[task]
name = "codimango/database-sharding"
description = "Hard multi-turn Go sharding proxy. Turn1 45 tests hard after removing empty ambiguous (silent on empty): weighted MD5 big-endian totalWeight, global broadcast -1 and comma-separated sorted, checksum sorted keys no spaces no HTML escaping, config validation duplicate id empty path negative id id>=count weight<=0 missing count invalid json missing file no stdout unknown command missing key arg set missing value, corruption backup .corrupt.<nanosec> warning, self-healing set cleans wrong shard delete cleans all, large 100KB nested json float, distribution zeros global, list-keys sorted exact, ops.log version shard_id ts big buffer skips invalid warning, help version checksum staging weight global ops.log. Turn2 67 tests balanced: versioned shard_id version data checksum where shard_id must match expected version increments, checksum no HTML escaping, corruption handling shard_id mismatch missing version negative version missing checksum mismatch backup .corrupt.<nanosec> warning, fallback legacy, duplicate/wrong-shard cleanup only correct weighted retains non-global global replicated, migration dry-run backup tightening .bak and ops.log.bak, version exact increment, distribution global after migration, large 100KB, empty valid MD5 d41d8cd98f00b204e9800998ecf8427e, unknown command missing args, help version shard_id checksum."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "database", "sharding", "proxy", "migration", "weighted", "broadcast", "checksum"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

