schema_version = "1.1"

[task]
name = "codimango/database-sharding"
description = "Hard multi-turn Go sharding proxy. Turn1 HARD v4 80 tests after removing empty ambiguous (silent on empty, not tested): weighted MD5 big-endian, global broadcast -1 and comma-separated sorted, checksum without HTML escaping SetEscapeHTML false sorted keys, config validation duplicate id empty path negative id id>=count weight<=0 missing shard_count invalid json missing file no stdout unknown command missing key arg set missing value, corruption backup .corrupt.<nanosec> warning corrupt/checksum and contains old data, self-healing set cleans wrong shard duplicates delete cleans all shards multiple wrong, large 100KB and nested large json and float many decimals and zero false and empty obj array and special chars in key and raw special atomic CreateTemp+Rename+SetEscapeHTML, distribution zeros and global counts and after delete and multiple global sets/deletes and many keys same shard, list-keys sorted exact with global and custom config weighted and after set/delete and empty after deleting all, ops.log with version shard_id ts big buffer 10MB skips invalid warning multiple appends version increment and large replay, help bare must contain version,checksum,staging,weight,global,timestamp,ts,atomic,createtemp,rename,setescapehtml. Turn2 HARD easier v5 62 tests (down from 83 too hard): versioned {shard_id,version,data,checksum} file-order replay no staging, backup .bak existence, etc."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "database", "sharding", "proxy", "migration", "weighted", "broadcast", "checksum"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "hard"
category = "software-engineering"
category_usecase = "migration"
category_subdomain = "distributed_systems"
tags = ["iterate_on_feature", "database", "sharding", "proxy", "migration", "golang", "distributed-systems", "weighted", "broadcast"]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"
expert_time_estimate_min = 70
junior_time_estimate_min = 130
languages = ["go"]

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[[steps]]
name = "1_step_one"
dependencies = []
min_reward = 1.0

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 600.0

[[steps]]
name = "2_step_two"
dependencies = ["1_step_one"]
min_reward = 1.0
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
