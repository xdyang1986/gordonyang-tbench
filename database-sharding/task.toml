schema_version = "1.1"

[task]
name = "codimango/database-sharding"
description = "Hard multi-turn Go sharding proxy. Turn1 HARD v4 80 tests after removing empty ambiguous (silent on empty): weighted MD5, global broadcast, checksum no HTML escaping SetEscapeHTML false, config validation all edge cases no stdout, self-healing set/delete multiple wrong, large 100KB nested json float zero false empty obj/array special chars raw special atomic CreateTemp+Rename+SetEscapeHTML, distribution zeros global etc., list-keys sorted exact custom weighted after set/delete empty after deleting all, ops.log version shard_id ts big buffer 10MB skips invalid warning multiple appends large replay, help version,checksum,staging,weight,global,timestamp,ts,atomic,createtemp. Turn2 HARD v5 70 tests balanced (down from 83 too hard with tricky large buffer nested, up from 62 too easy): versioned {shard_id,version,data,checksum} ts-sorted replay later ts wins, staging dir two-phase, self-healing set/delete, backup .bak existence and ops.log.bak content check, version exact increment old+1, distribution global after migration, config missing count, file-order ts test now true ts-sorted, large 100KB, empty valid MD5 d41d8, unknown command missing args."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "database", "sharding", "proxy", "migration", "weighted", "broadcast", "checksum"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "hard"
category = "software-engineering"
category_usecase = "migration"
category_subdomain = "distributed_systems"
tags = ["iterate_on_feature", "database", "sharding", "proxy", "migration", "golang", "distributed-systems", "weighted", "broadcast"]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"
expert_time_estimate_min = 70
junior_time_estimate_min = 130
languages = ["go"]

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[[steps]]
name = "1_step_one"
dependencies = []
min_reward = 1.0

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 600.0

[[steps]]
name = "2_step_two"
dependencies = ["1_step_one"]
min_reward = 1.0
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
