schema_version = "1.1"

[task]
name = "codimango/distant-estimate"
description = "Multi-turn Go CLI router. Turn1 builds raw-distance Dijkstra over undirected graph with last-wins survey-log override semantics (not min), strict JSON validation, leading-space-sensitive exact IDs, and lexicographic tie-breaking. Turn2 extends same binary with optional directed traffic manifest where factor names a congestion zone and delay is zone-entry toll (charged once per contiguous same-factor run, origin always pays, factor-1 shares zone with missing entries), requiring stateful search over (node,zone) and routing by effective distance while reporting raw along effective-best path."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "routing", "dijkstra", "shortest-path", "traffic-aware", "graph", "cli", "lexicographic-tie-break", "multi-turn"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "very hard"
category = "software-engineering"
category_usecase = "compute_result"
category_subdomain = "networking"
reward_type = "binary"
languages = ["go"]
tags = ["go", "routing", "effective-distance", "traffic-factor", "traffic-delay", "tie-break-cascade", "road-network", "logistics"]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[[steps]]
name = "1_step_one"
dependencies = []
min_reward = 1.0

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1800.0

[[steps]]
name = "2_step_two"
dependencies = ["1_step_one"]
min_reward = 1.0
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1800.0
