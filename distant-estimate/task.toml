schema_version = "1.1"

[task]
name = "codimango/distant-estimate"
description = "Multi-turn Go CLI router with all-or-nothing scoring. Turn1 raw Dijkstra with last-wins survey-log (unordered without traffic, per-direction when traffic present), duplicate-key detection via token streaming, FFFD guard (U+FFFD invalid), mixing families invalid, superseded validation, lex tie-break. Turn2 extends with optional directed traffic where factor names zone and delay is at-most-once-per-route toll (re-entering paid zone free), state over (node,zone,paidMask) bitmask <=4 distinct factors, factor-1 shares zone with missing, raw along effective direction-dependent per F1, 4-level tie-break eff->raw->toll-count->lex, expensive arrival wins."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "routing", "dijkstra", "shortest-path", "traffic-aware", "graph", "cli", "lexicographic-tie-break", "multi-turn"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "very hard"
category = "software-engineering"
category_usecase = "compute_result"
category_subdomain = "networking"
reward_type = "binary"
languages = ["go"]
tags = ["go", "routing", "effective-distance", "traffic-factor", "traffic-delay", "tie-break-cascade", "road-network", "logistics"]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[[steps]]
name = "1_step_one"
dependencies = []
min_reward = 1.0

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1800.0

[[steps]]
name = "2_step_two"
dependencies = ["1_step_one"]
min_reward = 1.0
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1800.0
