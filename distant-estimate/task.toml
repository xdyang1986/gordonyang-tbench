schema_version = "1.1"

[task]
name = "codimango/distant-estimate"
description = "Multi-turn Go CLI route planner. Turn 1 implements raw-distance shortest-path routing over an undirected road manifest, with strict JSON validation, append-ordered survey-log edge semantics, single and batch modes, exact exit codes, and deterministic lexicographic tie-breaking. Turn 2 extends the same binary with an optional directed traffic manifest: routing minimizes effective distance under per-zone congestion tolls and direction-dependent edge lengths, while still reporting raw distance along the effective-best path."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "routing", "dijkstra", "shortest-path", "traffic-aware", "graph", "cli", "lexicographic-tie-break", "multi-turn"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "very hard"
category = "software-engineering"
category_usecase = "compute_result"
category_subdomain = "networking"
reward_type = "binary"
languages = ["go"]
tags = ["go", "routing", "effective-distance", "traffic-factor", "traffic-delay", "tie-break-cascade", "road-network", "logistics"]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[[steps]]
name = "1_step_one"
dependencies = []
min_reward = 1.0

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1800.0

[[steps]]
name = "2_step_two"
dependencies = ["1_step_one"]
min_reward = 1.0
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1800.0
