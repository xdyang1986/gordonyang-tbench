description = "Multi-turn Go router GIGA HARD EXTRA – Turn1 (140 tests) raw-distance Dijkstra minimizing cumulative road length with tie-break cascade raw equal within 1e-9 → lex smallest route ASCII case-sensitive '-'<'.'<'_' 'A'<'a', undirected min duplicate including reverse, strict JSON validation (nodes strings-only, edges objects-only, leading/trailing spaces exact distinct, BOM/trailing comma/comment must not crash, scientific 1e+3/1E+3/1e+2 plus valid, +5 invalid), help precedence any help token wins even with unknown, flag equals and order independence, missing key vs empty distinct (RawMessage null check), non-existing location no-route vs invalid, strict output fields exactly path/distance, perf 2000 nodes <3.5s 5000 <4.5s 2000 batch <6s same-source amortized. Turn2 (279 tests) EXTRA HARD v2 based on online results (same-source amortization was only discriminator, now adds per-edge formula discrimination, raw-along-effective-best, delay-reset reverse interleaved, scientific plus mix, float tolerance, graph/requests validation with traffic, BOM/trailing/comment for requests, 5000 nodes same-source extra hard, 5000 batch correctness, flag missing value) extends with traffic-aware effective routing where effective = raw*factor+delay strict per-edge not (raw+delay)*factor, traffic_delay = effective-raw negative allowed when factor<1, factor>0 delay>=0 default 1.0/0, wrapper {\"traffic\":[...]} strict null vs [] valid vs direct array [] valid, BOM/trailing comma/comment must not crash for traffic file, leading/trailing spaces exact invalid, top-level string/number/null invalid, entries must be objects not null/number/string/array, missing from/to/factor invalid, from/to not-string/whitespace-only invalid, factor 0/negative/null/string/bool/object/array invalid, delay negative/null/string/bool/array invalid, duplicate same unordered including reverse B-A last-wins including delay reset to 0, extra fields ignored, effective tie 1e-9 -> raw tie -> lex smallest, deeper diamond-of-diamonds where decision at depth2, 10-way tie B..K pick B, secondary raw tie where effective equal raw differs pick smaller raw, case-sensitive ASCII, formula discrimination multi-edge sum, raw along effective-best not raw-best, delay-only reroute, factor-only reroute, output strict exactly 4 keys single with traffic 6 keys batch with traffic -1 for all distance fields on no-route, flag order independence with --traffic, equals syntax --traffic=path --graph=path --from=A --to=B, help precedence with traffic, single empty/whitespace from/to invalid exit2 vs batch empty no-route exit1 with -1 effective fields, requests validation with traffic (non-object/null/empty object/missing vs empty distinct, trailing comma), large graph 2000 nodes with traffic <5s 5000 <5.5s 10000 <8s, batch 2000/5000 with traffic relative bound 25*base+1 and same-source amortization <=25% distinct. Binary /app/router go build -o router . stdlib only."
