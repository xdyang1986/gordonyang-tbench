schema_version = "1.1"

[task]
name = "codimango/control-plan"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Debug and fix a buggy Go ZooKeeper-like control-plane coordinator shipped at /app/main.go. It handles membership (REGISTER/HEARTBEAT/FAIL), sticky weighted leader election with a leadership epoch, hash + minimal-disruption stable routing, zone-aware replica selection, and a crash-consistent durable log with recovery and compaction. It builds and runs but has subtle defects (a missing epoch bump on failover re-election, a zone-constraint leak in replica fill, and an off-by-one in durable-log recovery that drops the last record); the agent must localize and fix them in place so the hidden test suite passes, without rewriting from scratch."
keywords = ["go", "distributed", "zookeeper", "service-discovery", "leader-election", "consistent-hashing", "crash-consistency", "debugging"]

[[task.authors]]
name = "Gordon Yang"
email = "gordonyang@meta.com"

[metadata]
category = "software-engineering"
category_usecase = "compute_result"
category_subdomain = "distributed_systems"
difficulty = "medium"
languages = ["go"]

[verifier]
# Isolate grading from the agent: run the verifier in a fresh container so the
# agent's code can't read the oracle under /tests at verify time. Opt-in —
# uncomment to enable (also requires a verifier env def under tests/).
# environment_mode = "separate"
timeout_sec = 600.0
# Run the grader as a non-root user so in-process agent code (Flow B) can't read
# root-owned oracle files. Off by default because this template's test.sh uses
# apt-get (needs root); enable it when your verifier imports/runs agent code
# in-process and does not itself need root.
# user = "nobody"

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
