schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement from scratch a thread-safe in-memory pub-sub broker with a multi-stage publish pipeline (pause/queue -> filters -> retain -> mute -> route) and specificity routing: publish() notifies only the single most-specific matching tier (exact > longest prefix.* > global *) in (priority DESC, id DESC) order, while publish_all() fans out. Includes once-successful subscriptions, live-removal/snapshot-addition delivery, retained-message replay on subscribe, interceptor filters, mute patterns, pause/resume queueing, k-of-n dependency-ordered batch delivery (publish_ordered) with cascade release, per-subscription call budgets (max_calls) and data transforms, a global error handler, per-topic history logs, batch subscribe/publish, capacity-weighted distribution via integer water-filling with a saturation cascade (distribute), rendezvous-hash (HRW) sharded delivery (publish_sharded), and broad introspection. The contract deliberately departs from a textbook fan-out pub-sub across a large surface (all-or-nothing scoring); the water-fill, rendezvous-hashing, and dependency-ordering algorithms are the primary difficulty."
keywords = ["pubsub", "event-bus", "specificity-routing", "dependency-ordering", "thread-safety"]

