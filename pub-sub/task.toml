schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Build from scratch ultimate complex: multi-batch hierarchical broker allocator with min, priority, credit-decay. Input: T, T loads, G groups each prio min weight cap, S subs each gid prio min weight cap. State: group_total, sub_total, group_credit, sub_credit persist across batches. Effective group remaining cap = min(group rem cap, sum member rem caps). Per batch: group level allocate with min+priority+credit-decay primitive (min phase sorted prio desc, then weighted multi-round proportional rem*credit/total capped, progress guarantee highest credit, RR fallback total==0, credit update batch>0 ? credit/2+1 : +weight). Then per group allocate its share to members using same primitive. Output T lines CSV per sub per batch. No broken file. Go stdlib only."
keywords = ["allocation", "go", "broker", "fair-share", "hierarchical", "priority", "multi-batch"]

