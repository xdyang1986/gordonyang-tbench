[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Build from scratch balanced hard hierarchical multi-batch with min, priority, rate limits, credit-decay. Fixes Information Leakage Significant: remove paste-ready pseudocode matching reference line-for-line, now prose with inline formulas, exact credit recurrence and cap formulas declared necessary for determinism (Necessary Specification carve-out). Fixes Spec Clarity Over Specified: keep effective-cap and I/O as necessary spec, remove full algorithm prescription that removes engineering judgement. Fixes Output Ambiguity Minor: format T lines S CSV no spaces precise, Example2 output corrected from 2,5,1 vs oracle 2,6,1 contradiction and hedging maybe removed, Example3 corrected. Input: T, loads, G groups prio min weight cap rate (rate 0 unlimited), S subs gid prio min weight cap rate, may have blank lines/spaces robust. Effective group remaining cap = min(group rem cap, sum member effective per-batch caps, rate if >0) 0 if no members. Per batch group level then per-group members via min+priority+credit-decay primitive with persistent credits credit/2+1 if batch>0 else +weight, proportional share must avoid 64-bit overflow via 128-bit (1e12*1e12=1e24, 3*4e18=1.2e19). Output T lines CSV. Explicit robustness: blank lines, invalid gid->0, group no members, min>cap, priority tie deterministic, zero caps, large numbers, rate limiting, deterministic. Tests: 20 parametrized hierarchical multi-batch + conservation + deterministic + 8 corners (min>cap, priority tie/order, group no members, invalid gid, blank lines/spaces, large 1e12, large weight 1e24, large credit 1.2e19, rate limiting, zero caps) + fuzz_random 20 sequences vs Python reference = 32 tests total, fixing README 60 vs 25 and missing corners and test.sh set -e reward path. No broken file, offline verifier via Dockerfile preinstall pytest, filesystem defense chmod 000 during binary execution, efficient golden handles 1e12 and overflow, trials regenerated via harbor oracle mean 1.0."
keywords = ["allocation", "go", "broker", "fair-share", "priority", "multi-batch"]

