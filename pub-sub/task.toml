schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Build from scratch ultimate complex: multi-batch hierarchical broker allocator with min, priority, credit-decay, plus 8 implicit robustness corner cases. Input: T, loads, G groups prio min weight cap, S subs gid prio min weight cap, may have blank lines/spaces. Core primitive allocate_batch fully explicit (min phase prio desc tie idx asc, give = min(min,cap,rem), weighted multi-round rem*credit/total capped, progress guarantee max credit tie lowest idx, efficient RR fallback bulk cycles input order when total==0, credit update credit/2+1 if batch>0 else +weight, effective group cap = min(group rem, sum member rem) explicit). Edge handling partially implicit to increase difficulty: blank lines/spaces robust parsing, invalid gid ->0 no crash, group no members eff 0, min>cap capped, min>load priority order, zero caps/loads, large numbers up to 1e12 efficient 64-bit, deterministic tie-breaking, credit never negative. Combines hierarchical + min + priority + multi-batch persistent credit. Output T lines CSV per sub per batch. No broken file. Go stdlib only. 50 parametrized hierarchical multi-batch cases + conservation + deterministic + 8 corner tests (min>cap, priority tie, group no members, invalid gid, blank lines, large 1e12, RR fallback, zero caps) = 60 tests. Verifier offline via Dockerfile preinstalled pytest, no apt-get/network, efficient golden handles 1e12."
keywords = ["allocation", "go", "broker", "fair-share", "hierarchical", "priority", "multi-batch"]

