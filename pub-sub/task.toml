schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "ULTIMATE VERY HARD with burst, cost, dynamic weight, priority aging, negative deallocation, global rebalancing, T+8 output. Even harder after still too easy. Input T loads may be negative +-1e12, G groups prio min weight cap rate burst (6 fields), S subs gid prio min weight cap rate burst cost (8 fields) cost>=1 per msg, caps are total cost (count*cost). Supports old formats 5-field groups burst0 and 6-field subs burst0 cost1 and 7-field subs cost1 for backward compat but full 6/8 required for hard cases. Output T+8 lines: T batch counts S CSV (may be negative), group totals cost G CSV, sub totals cost S CSV, group final credits G CSV, sub final credits S CSV, group burst rem G CSV, sub burst rem S CSV, group final weights G CSV, sub final weights S CSV. State: totals cost, credits start weight, weights start weight dynamic max(1,floor(w*0.9)) if alloc!=0 else w+1, burst_rem start burst one-time extra to exceed rate (rate+burst_rem max per batch count), aging streak consecutive misses where eligible but alloc==0, effective priority = basePrio + streak//2. Effective caps: sRemCost=cap-totalCost, sRemCount=floor(sRemCost/cost), sEffCount=min(sRemCount, rate+burst_rem if rate>0), sumMemberEff per group, minCostInGroup, gRemCost=cap-totalCost, gRemCount=floor(gRemCost/minCost) if has members else 0, effGCount=min(gRemCount,sumMemberEff, rate+burst_rem if rate>0, 0 if no members). Weighted loop pinned: active set alloc<effCap, total=sum temp credits, share=floor(rem*credit/total) via 128-bit mulDiv capped to cap-alloc, used==0 fallback highest credit tie idx, temp credit floor(c/2)+1 if delta>0 else +weight, bulk RR fallback when total==0. Credit update floor(p/2)+1 if alloc!=0 else +weight_old. Burst consumption after positive batch if alloc>rate: excess consumes burst_rem. Global rebalancing while remaining>0 up to 10 iter recomputing eff caps with rate remaining (rate+burst_rem - batch) and cost, returning unused capacity. Negative: N=-load dealloc by priority desc tie idx groups then members, respecting totals never <0, burst unaffected, counts as activity. Deterministic. Overflow-safe 1e24/1.2e19. Tests 52 total: 27 exact (20 original burst0 cost1 +5 burst/negative +2 cost) + 25 corners/invariants covering min>cap, min>rate, min>rate+burst, tie/order, no members, invalid gid, blank lines/spaces/tabs, large 1e12, weight 1e24, credit 1.2e19, rate, burst, zero caps, zero load, cap exhaustion 3 batches, global rebalancing 1,1,8->2,8, dynamic weight, final totals/cost consistency, negative deallocation, burst consistency, cost factor 2/5 and 2/3, priority aging. Oracle 52/52 mean 1.0, opencode claude-sonnet-4 0.0 very hard."
keywords = ["allocation", "go", "broker", "fair-share", "priority", "multi-batch"]

