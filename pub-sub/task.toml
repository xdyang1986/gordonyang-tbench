schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Build from scratch hierarchical: implement a Go program at /app/main.go that is a two-level broker fan-out allocator. Groups have weight/cap, subscribers have gid/weight/cap. Effective group cap = min(group cap, sum member caps). First allocate load to groups using credit-decay weighted allocation (credit starts weight, decays to credit/2+1 when served else +weight, proportional share rem*credit/total capped, progress guarantee highest-credit fallback, total==0 fallback RR). Then for each group allocate its group share to its members using same primitive. Input: load, G, G lines group_weight group_cap, S, S lines gid weight cap. Output: comma CSV per subscriber in input order. No broken file shipped. Go stdlib only; pytest builds and checks many hierarchical cases plus invariants."
keywords = ["allocation", "go", "broker", "fair-share", "hierarchical"]

