schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement from scratch, in Go, a command-driven in-memory pub-sub broker CLI (reads commands on stdin, prints one line per command). Specificity routing: PUB notifies only the single most-specific matching tier (exact > longest prefix.* > global *) in (priority DESC, id DESC) order, while PUBALL fans out. Includes a publish pipeline (pause/queue -> retain -> mute -> history -> route), per-subscription call budgets (max_calls) with retained-message replay on subscribe, mute patterns, pause/resume queueing, k-of-n dependency-ordered batch delivery (ORDERED) with cascade release, capacity-weighted distribution via integer water-filling with a saturation cascade (DISTRIBUTE), rendezvous-hash sharded delivery (SHARD), consistent-hash ring routing with virtual nodes (RING), stride-scheduled weighted-fair delivery (FAIR), token-bucket rate limiting (METER/REFILL), in-order sequence delivery with reorder buffer (SEQ), and broad introspection. The contract deliberately departs from a textbook fan-out pub-sub across a large surface (all-or-nothing scoring); the water-fill, rendezvous/ring hashing, stride scheduling, and dependency-ordering algorithms are the primary difficulty. Go stdlib only."
keywords = ["pubsub", "event-bus", "specificity-routing", "dependency-ordering", "go"]

