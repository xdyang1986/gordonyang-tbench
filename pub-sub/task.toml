description = "Build from scratch balanced hard hierarchical multi-batch with min, priority, rate limits, credit-decay. Fixes Information Leakage Significant: remove paste-ready pseudocode matching reference line-for-line, now prose with inline formulas, exact credit recurrence and cap formulas declared necessary for determinism (Necessary Specification carve-out). Fixes Spec Clarity Over Specified: keep effective-cap and I/O and min-order and weighted-loop as necessary spec for byte-exact determinism, but describe as prose formulas not paste-ready Go code, retaining engineering judgement for overflow-safe mulDiv and efficient impl. Fixes Output Ambiguity Minor (weighted leftover/rounding): previously only said proportional + progress guarantee, leaving rounding distribution ambiguous despite byte-exact test_allocation; now pins deterministic multi-round weighted loop: active set, total= sum temp credits, share=floor(rem*credit/total) via 128-bit mulDiv capped, used==0 fallback highest credit tie lowest idx, temp credit update floor(c/2)+1 if delta>0 else +weight, bulk RR fallback when total==0 (shouldn't happen with correct decay but required for termination), persistent credit update floor(p/2)+1 if batch>0 else +weight. Also pins min-order priority desc tie idx, effective caps, hierarchical group-then-member, credit start=weight. Fixes Output Format: T lines S CSV no spaces precise, Example2 corrected from 2,5,1 vs oracle 2,6,1. Fixes Test Quality Too Restrictive: retains 20 parametrized exact tests now justified as necessary because weighted loop is fully pinned, plus conservation + deterministic 20 random + 8 corners (min>cap, tie/order, no members, invalid gid, blank lines/spaces, large 1e12, large weight 1e24, large credit 1.2e19, rate limiting, zero caps) + fuzz_invariants 30 random lenient invariant checks (caps, effective caps, non-negative) providing lenient path beyond exact-match. Tests 33 total (20 exact + 13 invariant/corner). No broken file, offline verifier via Dockerfile preinstall pytest, filesystem defense chmod 000 during binary execution, efficient golden handles 1e12 and overflow, oracle mean 1.0 after fixing case [10,10] expected 3,2,5."
