schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Build from scratch ultimate complex with explicit spec, fixes BAD_GRADING_WRONG. Multi-batch hierarchical broker allocator with min, priority, credit-decay. Input: T, loads, G groups prio min weight cap, S subs gid prio min weight cap, may have blank lines/spaces. State: group_total, sub_total, group_credit, sub_credit persist. Per batch effective group remaining cap = min(group rem cap, sum member rem caps) explicit, 0 if no members. Per level allocate_batch fully explicit: min phase sorted prio desc tie idx asc, give = min(min, cap, rem), then weighted credit-decay multi-round: active alloc<remCap, total sum credit, if total==0 efficient RR fallback bulk cycles + partial input order, else share = rem*credit/total capped, if used==0 best max credit tie lowest idx, credit_tmp update credit/2+1 if served else +weight, final credit update based on batch>0. Output T lines CSV. Explicit handling: blank lines, invalid gid ->0, min>cap capped, group no members eff 0, large numbers up to 1e12 efficient O(n log n) not O(load), 64-bit, deterministic. No broken file. Go stdlib only. 30 main hierarchical cases + 8 explicit corner tests (min>cap, priority tie, group no members, invalid gid, blank lines, large 1e12, RR fallback, zero caps) + conservation + deterministic = 40 tests. Verifier offline, no apt-get/network."
keywords = ["allocation", "go", "broker", "fair-share", "hierarchical", "priority", "multi-batch"]

