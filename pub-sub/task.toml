schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Build from scratch balanced complex: single-level multi-batch broker allocator with min, priority, credit-decay, fully explicit core to fix BAD_AMBIGUOUS/WRONG, efficient golden for 1e12 to fix BAD_GOLDEN, offline verifier to fix BAD_GRADING_WEAK. Input: T, loads, S subs prio min weight cap, may have blank lines/spaces. Primitive allocate_batch explicit: min phase prio desc tie idx asc give = min(min,cap,rem), weighted multi-round rem*credit/total capped, progress guarantee max credit tie lowest idx, efficient RR fallback bulk cycles input order when total==0, credit update credit/2+1 if batch>0 else +weight. Multi-batch persistent credits and totals across batches. Output T lines CSV per sub per batch, precise no spaces, 64-bit efficient. Edge robustness explicit: blank lines/spaces, min>cap capped, priority tie deterministic, zero caps, large 1e12, deterministic. Tests: 21 parametrized multi-batch covering weighted, min+priority, multi-batch credit persistence, plus conservation, plus 5 corner tests (min_exceeds_cap, priority_tie_and_order, blank_lines_and_spaces, large_numbers 1e12, deterministic) = 27 tests total, fixing previous README 60 vs 25 mismatch and missing RR/group-no-members which are not needed for single-level. test.sh fixed for set -e. No broken file, empty /app, avoids contamination. Go stdlib only."
keywords = ["allocation", "go", "broker", "fair-share", "priority", "multi-batch"]

