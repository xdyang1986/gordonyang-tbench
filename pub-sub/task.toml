description = "Balanced harder (65 tests, T lines) with burst, cost, dynamic weight, negative, global rebalancing - closes BAD_GRADING_WEAK grading hole via exact multi-batch cases killing mutants: dynamic weight 1,1,10 verbatim, served-decay vs eligible-but-unallocated +1, burst carryover where batch2 cap differs because batch1 consumed burst (5,5 -> 3,2 then 1,1), negative dealloc cost>1, credit off-by-one multi-round. Fixes R07 chmod theater (drop chmod, rely on fuzz/deterministic). Fixes too easy 33-test base and too complex 56-test T+8 timeout 4320s. Input T loads +-1e12, G groups prio min weight cap rate burst (6 fields), S subs gid prio min weight cap rate burst cost (8 fields) cost>=1 caps total cost, supports old 5-field groups burst0 and 6-field subs burst0 cost1 and 7-field subs cost1 backward compat (tested raw). Effective caps: sRemCost=cap-totalCost, sRemCount=floor(sRemCost/cost), sEffCount=min(sRemCount, rate+burst_rem if rate>0), sumMemberEff, gRemCost, gRemCount=floor(gRemCost/minCost) if has members else 0, effG=min(gRemCount,sumMemberEff,rate+burst_rem,0 if no members). Invalid gid excluded from totals AND credit/weight/burst updates. Min-phase order priority desc tie idx capping min(min,effCap,rem). Weighted loop fully pinned prose: temp credits init persistent, active alloc<effCap, total=sum credits, if total==0 bulk RR fallback, else share=floor(rem*credit/total) via 128-bit mulDiv, capped, fallback highest credit tie idx, temp credits c/2+1 if delta>0 else +weight, repeat. Persistent credit c/2+1 if alloc!=0 else +weight_old, dynamic weight max(1,floor(mulDiv(w,9,10))) else w+1 overflow-safe. Burst consumption after positive batch excess over rate consumes burst_rem. Global rebalancing while remaining>0 up to 10 iter recomputing eff caps. Negative dealloc by priority desc groups then members never <0. Output T lines S CSV. Tests 65 total: 34 exact allocation (24 original +10 new exact multi-batch killing credit, burst, weight mutants +3 sensitive converted to exact) +21 corners. Agent timeout 2400 sec covers claude-code 1392-1936s observed (includes build/verify overhead)."

