[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Debug-in-place hierarchical broker allocator with burst, cost, dynamic weight, negative, rebalancing - 4 defects: 3 invariant violations in rebalancing loop forgetting within-batch allocation (sRemCostIter omits -subBatch*cost -> exceeds sub cost cap 10 fails, group rateRem omits -groupBatchCount -> exceeds group rate+burst 11 fails, sub rateRem omits -subBatchCount -> exceeds sub rate 6 fails) + credit off-by-one c/2 vs c/2+1 (pins weight recurrence via credit). Combined 28/70 failing, reference 70/70, go vet clean. Shipped as environment/broken/main.go. Instruction only I/O format + Invariants + 4 failing examples (no algorithm spec, rephrase-proof). Examples: cap violation 2/15/12 -> 5,3,2/0,0,0 vs shipped 6,3,2 (sub cap5 cost1 ->6 exceeds), group rate 2/5/5 rate2 burst3 -> 3,2/1,1 vs shipped 3,2/3,2 (batch2 exceeds rate+burst), sub rate 2/5/5 ->5/2 vs 5/5, weight pinning 4/1/1/1/12 weights1,4 ->0,1/0,1/1,0/5,7 vs shipped 0,1/1,0/0,1/6,6 starves sub0 two batches pinning +1 recurrence. Agent timeout 3000 sec (only passing trial used 2079s of 2400). Dockerfile base golang:1.26.2-bookworm, relies on python3 preinstalled in buildpack-deps, pip install pytest with retries (no apt-get) to eliminate SandboxBuildFailedError ECR/mirror and apt flakiness, no rubric-ID comments. Group min re-applied every iter mutant is provably unkillable black-box (0 diffs in 200k): outer loop never has second productive iteration for correct impl (allocateBatch consumes min(load,cap))."

