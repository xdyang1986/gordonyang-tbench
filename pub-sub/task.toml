schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Build from scratch balanced hard hierarchical multi-batch with min, priority, credit-decay, fixes all quality flags including Information Leakage (remove paste-ready pseudocode) and Spec Clarity (fix example outputs) and BAD_GOLDEN (efficient RR) and R06 64-bit safety (large-weight 1e24 and large-credit 1.2e19 overflow tests) and R09 offline verifier. Input: T, loads, G groups prio min weight cap, S subs gid prio min weight cap, may have blank lines/spaces. Effective group remaining cap = min(group rem, sum member rem) 0 if no members. Per batch: group level allocate via min+priority+credit-decay primitive (min phase prio desc tie idx asc give = min(min,cap,rem), weighted multi-round rem*credit/total capped must avoid 64-bit overflow via math/bits 128-bit, progress guarantee max credit tie lowest idx, efficient RR bulk cycles for large rem, credit update credit/2+1 if batch>0 else +weight persistent). Output T lines CSV per sub per batch precise no spaces. Explicit robustness: blank lines/spaces, invalid gid->0, group no members, min>cap, priority tie, zero caps, large numbers 1e12, large-weight 1e24, large-credit 1.2e19, deterministic. Tests: 20 parametrized hierarchical multi-batch + conservation + deterministic + 8 corners (min>cap, priority tie, group no members, invalid gid, blank lines, large 1e12, large weight 1e24, large credit 1.2e19, zero caps, rr fallback) + fuzz_random 20x random vs Python reference = 32 tests total, fixing README 60 vs 25 mismatch, reward path set -e, trials regenerated from current definition. No broken file, offline verifier via Dockerfile preinstall pytest."
keywords = ["allocation", "go", "broker", "fair-share", "priority", "multi-batch"]

