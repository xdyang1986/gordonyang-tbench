schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Debug-in-place hierarchical broker allocator with burst, cost, dynamic weight, negative, rebalancing - 3 subtle planted bugs (credit off-by-one multi-round, burst carryover consumption check, eligible-but-unallocated weight+1 missing). Shipped as environment/broken/main.go with defects, instruction gives only I/O format and 3 failing input/output examples, no algorithm spec, rephrase-proof (Avocado rephrases instruction.md not shipped code, why v17 survived). Agent must reverse-engineer intended behavior from shipped code and localize deviation. Reference solve.sh writes corrected program. Failing examples: 5,5,5 weights 3,1 -> 4,1 each (credit), 5,5,5 rate2 burst3 -> 3,2 then 1,1 (burst), 1,1,10 weights 1,2 -> 0,1 /1,0 /4,6 (dynamic weight). Fourth example 6,-3,6,6 for loosening if all-agents-0: 4,2 /-3,0 /3,3 /3,3 vs shipped 4,2 /-3,0 /0,6 /6,0 covers negative activity and burst. Agent timeout 2400 sec covers observed claude-code 1392-1936s including build/verify overhead. Dockerfile base golang:1.26.2-bookworm not rate-limited ECR mirror, with retries for apt/pip."

keywords = ["allocation", "go", "broker", "fair-share", "priority", "multi-batch", "debug-in-place"]

