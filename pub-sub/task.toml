description = "Debug-in-place hierarchical broker allocator with burst, cost, dynamic weight, negative, rebalancing - 4 defects (3 invariant violations + 1 in-round credit): D1 creditTmp=c/2 vs c/2+1 in-round weighted loop (E4 single-batch 1/12 ->7,3,2 vs 8,3,1, visible because 2 persistent credit sites now correct c/2+1 at L663/L685 agreeing), D2 sRemCostIter omits -subBatch*cost -> exceeds sub cost cap (E1 2/15/12 ->5,3,2 vs 6,3,2), D3 sub rateRem omits -subBatch -> exceeds sub rate (E3 2/5/5 ->5/2 vs5/5), D4 group rateRem omits -groupBatch -> exceeds group rate+burst (E2 2/5/5 ->3,2/1,1 vs3,2/3,2). Persistent credit sites at L663 groupCredit and L685 subCredit now ship correct (c/2+1) to provide internal reference point, turning unguessable recurrence into visible inconsistency (3 sites, 2 agreeing, 1 not). Combined 27/70 failing (was 28, surface essentially unchanged so grading strength holds), ref 70/70, go vet clean. Shipped as environment/broken/main.go. Instruction only I/O format + Invariants + 4 failing examples 1:1 defect mapping (no algorithm spec, rephrase-proof), verified by tools/audit_defects.py which diffs ref vs broken and fails if any defect invisible. Agent timeout 3600 sec (was 3000, metacode trial at 9182e39 ran 3040s >3000, durations climbing 1475->2277->3040). Dockerfile golang:1.26.2-bookworm python3 preinstalled, pip install pytest with retries no apt-get."

