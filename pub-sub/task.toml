[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Debug-in-place hierarchical broker allocator with burst, cost, dynamic weight, negative, rebalancing - 6 defects (3 invariant violations + 3 credit sites): D1 creditTmp=c/2 vs c/2+1 in-round weighted loop (invisible before E5, single-batch 1/12 ->7,3,2 vs 8,3,1), D2 sRemCostIter omits -subBatch*cost -> exceeds sub cost cap (E1 2/15/12 ->5,3,2 vs 6,3,2), D3 sub rateRem omits -subBatch -> exceeds sub rate (E3 2/5/5 ->5/2 vs5/5), D4 group rateRem omits -groupBatch -> exceeds group rate+burst (E2 2/5/5 ->3,2/1,1 vs3,2/3,2), D5 groupCredit=c/2 vs c/2+1 persistent (invisible before E6, two groups 2/8/4 ->2,6/1,3 vs2,6/0,4), D6 subCredit=c/2 vs c/2+1 (E4 discriminating 3/4/4/10 ->1,3/1,3/3,7 vs1,3/0,4/10,0 no rates/bursts/costs). Combined 28/70 failing, ref 70/70, go vet clean. Shipped as environment/broken/main.go. Instruction only I/O format + Invariants + 6 failing examples 1:1 defect mapping (no algorithm spec, rephrase-proof), verified by tools/audit_defects.py which diffs ref vs broken and fails if any defect invisible. Agent timeout 3000 sec. Dockerfile golang:1.26.2-bookworm python3 preinstalled, pip install pytest with retries no apt-get to eliminate SandboxBuildFailedError. Group min re-applied mutant is provably unkillable (0 diffs in 200k) because outer loop never has second productive iteration."

