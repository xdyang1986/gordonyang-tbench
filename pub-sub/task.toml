[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Build from scratch balanced complex: single-level multi-batch broker allocator with min, priority, credit-decay. Fixes Information Leakage Significant (remove paste-ready pseudocode that matched reference line-for-line, now prose with formulas), fixes Spec Clarity (correct Example 3 output 4,0,2 / 3,1,2 vs previous 4,1,1 contradiction, remove hedging). Input: T, loads, S subs prio min weight cap, may have blank lines/spaces. Core explicit: min phase prio desc tie idx, give = min(min,cap,rem), weighted multi-round rem*credit/total capped, progress guarantee max credit tie lowest idx, efficient RR bulk cycles input order when total==0, credit update credit/2+1 if batch>0 else +weight persistent across batches, explicit handling blank lines, min>cap capped, zero caps, large 1e12 efficient 64-bit, deterministic. Output T lines CSV per sub per batch precise no spaces. Fixes BAD_AMBIGUOUS/WRONG via explicit unique formulas, BAD_GOLDEN via efficient RR for 1e12, BAD_GRADING_WEAK via explicit large and RR tests and offline verifier (Dockerfile preinstall pytest, no apt-get/network). Tests: 21 parametrized multi-batch + conservation + deterministic + 6 corners (min_exceeds_cap, priority_tie, blank_lines, large_numbers 1e12, zero_caps, rr_fallback_efficiency) = 29 tests total, fixing README 60 vs 25 mismatch and previous missing RR, zero-caps, priority-tie, deterministic. test.sh reward path fixed for set -e via if pytest then else. No broken file. Go stdlib only."
keywords = ["allocation", "go", "broker", "fair-share", "priority", "multi-batch"]

