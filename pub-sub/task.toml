schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Debug in place: a Go program at /app implements a message broker's fan-out allocator (distribute a batch of messages across weighted, capacity-limited subscribers). It builds and mostly works but has a subtle bug — for some inputs the allocation is wrong. The agent must find and fix the defect so the output is correct in general; do not rewrite. The instruction gives only the I/O format and a few failing input/output examples, NOT the algorithm (a bespoke multi-round credit-decay weighted allocation embodied in the shipped code). The defect is a subtle off-by-one in the per-round credit decay that only manifests in multi-round allocations, so it must be found by understanding the shipped algorithm and tracing, not by reading a spec. Go stdlib only; pytest builds the program and drives it via stdin/stdout."
keywords = ["debugging", "reverse-engineering", "allocation", "go", "broker"]

