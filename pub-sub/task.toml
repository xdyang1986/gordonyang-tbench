schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Build from scratch ultimate complex balanced: multi-batch hierarchical broker allocator with min, priority, credit-decay, fully explicit core to fix BAD_AMBIGUOUS/WRONG, efficient golden for 1e12 to fix BAD_GOLDEN, offline verifier to fix BAD_GRADING_WEAK. Input: T, loads, G groups prio min weight cap, S subs gid prio min weight cap, may have blank lines/spaces. Primitive allocate_batch explicit: min phase prio desc tie idx asc give = min(min,cap,rem), weighted multi-round rem*credit/total capped, progress guarantee max credit tie lowest idx, efficient RR fallback bulk cycles input order when total==0, credit update credit/2+1 if batch>0 else +weight, effective group cap = min(group rem, sum member rem) 0 if no members. Hierarchical multi-batch persistent credits across batches. Output T lines CSV per sub per batch, precise no spaces. Edge robustness: blank lines, invalid gid->0, group no members eff 0, min>cap capped, priority tie deterministic, zero caps, large 1e12 64-bit, RR fallback. Tests: 20 parametrized hierarchical multi-batch covering core + conservation + deterministic + 8 corner tests (min_exceeds_cap, priority_tie_and_order, group_no_members, invalid_gid, blank_lines_and_spaces, large_numbers 1e12, rr_fallback_multi_batch, zero_caps) = 30 tests total, all present, fixing previous README 60 vs 25 mismatch. test.sh reward path fixed to handle set -e via if pytest then else. No broken file, empty /app, avoids contamination. Go stdlib only."
keywords = ["allocation", "go", "broker", "fair-share", "hierarchical", "priority", "multi-batch"]

