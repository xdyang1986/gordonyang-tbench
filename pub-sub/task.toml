description = "ULTIMATE EXTREME with burst, cost, dynamic weight, priority aging, negative deallocation, global rebalancing, T+8 output, 56 tests. Fixes Test Quality Other Quality Issues: previously several corner tests near-vacuous (priority_aging, dynamic_weight_and_credit asserted only line count or w>=1), backward-compat parsing untested, fuzz only invariants not exact. Now: priority_aging exact [1,0],[1,0],[0,1] after 2 misses aging boost, dynamic_weight_and_credit exact [3,2],[3,2] with final weights 8,8 and totals cost, all corner tests check full T+8 exact including totals/credits/burst/weights not just first line, added backward-compat tests for old 5-field groups and 6-field subs and 7-field subs via raw inputs comparing to new format, added fuzz exact vs Python reference (20 random exact byte match Go vs Py) alongside invariant fuzz 30 random. Also adds cost factor tests exact 3,2->16 cost and 4,4->20, min>rate+burst exact 5 with burst 0, global rebalancing 1,1,8->2,8 exact, negative deallocation exact, burst final consistency exact. Input 6 fields groups burst, 8 fields subs cost, supports old formats. Output T+8 lines: batch counts, group totals cost, sub totals cost, group credits, sub credits, group burst rem, sub burst rem, group weights, sub weights. State: totals cost, credits start weight, weights dynamic max(1,floor(w*0.9)) if alloc!=0 else w+1, burst_rem one-time, aging effectivePriority=base+streak//2, effective caps sRemCost/cost, sEffCount min(remCount, rate+burst_rem), sumMemberEff, gRemCount floor(gRemCost/minCost), effG min(gRemCount,sumMemberEff,rate+burst_rem). Weighted loop pinned share floor(rem*credit/total) via 128-bit mulDiv capped fallback highest credit tie idx temp credit decay/growth, bulk RR fallback. Credit floor(p/2)+1 else +weight_old, burst consumption excess over rate, global rebalancing up to 10 iter, negative dealloc priority desc. Oracle 56/56 mean 1.0, opencode 0.0 very hard."
