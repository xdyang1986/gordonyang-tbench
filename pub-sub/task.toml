schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "VERY HARD ultimate hierarchical allocator with burst, dynamic weights, negative deallocation, global rebalancing, min, priority, rate, credit-decay, T+6 output. Even harder after still too easy. Input: T loads may be negative up to +-1e12, G groups prio min weight cap rate burst (6 fields), S subs gid prio min weight cap rate burst (7 fields). Output T+6 lines: T batch S CSV (may be negative), group totals G CSV, sub totals S CSV, group final credits G CSV, sub final credits S CSV, group final burst rem G CSV, sub final burst rem S CSV. State: totals, credits start weight, weights start weight dynamic max(1,floor(w*0.9)) if alloc!=0 else w+1, burst_rem start burst one-time extra to exceed rate (rate+burst_rem max per batch), effective caps min(remCap, rate+burst_rem if rate>0), sumMemberEff, eff_g min(g_rem,sumMemberEff,rate+burst_rem). Weighted loop pinned: active set, total=sum credits, share=floor(rem*credit/total) via 128-bit mulDiv capped, used==0 fallback highest credit tie idx, temp credit floor(c/2)+1 if delta>0 else +weight, bulk RR when total==0. Persistent credit floor(p/2)+1 if alloc!=0 else +weight_old. Burst consumption after positive batch if alloc>rate: excess consumes burst_rem. Global rebalancing while remaining>0 recomputing eff caps (remCap, rateRem, sumMemberEff) up to 10 iter returning unused capacity. Negative loads: deallocation by priority desc tie idx groups then members, respecting totals never <0, burst unaffected, credit/weight counts deallocation as activity. Deterministic tie idx. Overflow-safe. Fixes Output Ambiguity (weighted leftover/rounding, T+6, burst, negative) fully pinned, Too Restrictive (20 exact now justified + lenient invariants), Too Easy (added burst, negative, dynamic weight, global rebalancing, T+6). Tests 48 total: 25 exact (20 original burst0 +5 new burst/negative) + conservation + 8 classic corners (min>cap, min>rate, min>rate+burst, tie/order, no members, invalid gid, blank lines/spaces/tabs, large 1e12, weight 1e24, credit 1.2e19, rate, zero caps) + 6 new hard corners (rate+burst, global rebalancing 1,1,8->2,8, dynamic weight, final totals consistency, negative deallocation, burst consistency, zero load, 3-batch exhaustion) + deterministic 20 random including negative/burst + fuzz 30 random invariant-only with burst. Oracle 48/48 mean 1.0, opencode claude-sonnet-4 mean 0.0 indicating very hard."
keywords = ["allocation", "go", "broker", "fair-share", "priority", "multi-batch"]

