schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "HARD hierarchical allocator with dynamic weights, global rebalancing, min, priority, rate, credit-decay, T+4 output. Harder after still too easy. Fixes Output Ambiguity (weighted leftover/rounding and T+4) now pinned as necessary spec prose: effective caps min(remCap,sumMemberEff,rate), min-order priority desc tie idx capping min(min,cap,rate,rem), weighted loop active set total=sum credits share=floor(rem*credit/total) via 128-bit mulDiv capped used==0 fallback highest credit tie idx temp credit floor(c/2)+1 if delta>0 else +weight bulk RR when total==0, persistent credit floor(p/2)+1 if alloc>0 else +weight_old, dynamic weight max(1,floor(w*0.9)) if alloc>0 else w+1, global rebalancing while remaining>0 recomputing eff caps returning unused capacity (up to 10 iter). Output T+4 lines: T batch S CSV + group totals G CSV + sub totals S CSV + group final credits G CSV + sub final credits S CSV. Fixes Too Restrictive: 20 exact now justified, plus lenient invariants. Fixes Too Easy: added dynamic weight, global rebalancing, T+4 output, rate remaining across rebalancing, min>rate capping, plus new hard corners: rebalancing 1,1,8->2,8, dynamic weight, final totals consistency, zero load, 3-batch exhaustion. Tests 39 total (20 exact + 19 invariant/corner) covering min>cap, min>rate, tie/order, no members, invalid gid, blank lines/spaces/tabs, large 1e12, weight 1e24, credit 1.2e19, rate limiting, zero caps, zero load, cap exhaustion. Offline verifier, filesystem defense chmod 000, overflow-safe mulDiv, oracle 39/39 mean 1.0."
keywords = ["allocation", "go", "broker", "fair-share", "priority", "multi-batch"]

