schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Build from scratch balanced hard: hierarchical single-batch with min, priority, credit-decay. Rebalanced after multi-batch hierarchical 60-test too hard 0/5 and single-level multi-batch 27-test too easy. Input: load, G groups prio min weight cap, S subs gid prio min weight cap, may have blank lines/spaces. Effective group cap = min(group cap, sum member caps) 0 if no members. Primitive allocate explicit: min phase prio desc tie idx asc give = min(min,cap,rem), weighted credit-decay multi-round rem*credit/total capped, progress guarantee max credit tie lowest idx, efficient RR bulk cycles input order when total==0, credit update credit/2+1 if served else +weight. First allocate load to groups using eff caps, then per group allocate its share to members. Output single line CSV in input order precise no spaces, 64-bit efficient 1e12. Explicit robustness: blank lines/spaces, invalid gid->0, group no members eff 0, min>cap capped, priority tie deterministic, zero caps, large numbers, deterministic. Fixes Information Leakage Significant (remove paste-ready pseudocode line-for-line, now prose), fixes Spec Clarity example outputs matching tests (no contradiction). Tests: 20 hierarchical single-batch + conservation + deterministic + 6 corners (min_exceeds_cap, priority_tie, group_no_members, invalid_gid, blank_lines, large_numbers, zero_caps) = 29 tests total, fixing README 60 vs 25 mismatch and test.sh set -e reward path. No broken file, offline verifier via Dockerfile preinstall pytest, efficient golden."
keywords = ["allocation", "go", "broker", "fair-share", "priority", "multi-batch"]

