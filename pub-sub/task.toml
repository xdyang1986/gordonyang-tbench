[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Balanced harder (48 tests, T lines) with burst, cost, dynamic weight, negative, global rebalancing - fixes too easy (33-test base no burst/cost/negative) and too complex (56-test T+8 with aging+final weights+exact fuzz that caused timeout 4320s no Go files for all agents). Input: T loads may be negative +-1e12, G groups prio min weight cap rate burst (6 fields), S subs gid prio min weight cap rate burst cost (8 fields) cost>=1 caps total cost, supports old 5-field groups burst0 and 6-field subs burst0 cost1 and 7-field subs cost1 backward compat (tested raw). Effective caps: sRemCost=cap-totalCost, sRemCount=floor(sRemCost/cost), sEffCount=min(sRemCount, rate+burst_rem if rate>0), sumMemberEff per group, minCostInGroup, gRemCost, gRemCount=floor(gRemCost/minCost) if has members else 0, effG=min(gRemCount,sumMemberEff,rate+burst_rem,0 if no members). Invalid gid excluded from totals AND credit/weight/burst updates. Min-phase order priority desc tie idx capping min(min,effCap,rem). Weighted deterministic loop fully pinned prose: temp credits init persistent, active alloc<effCap, total=sum credits, if total==0 bulk RR fallback minRem cycles 1-by-1 idx, else share=floor(rem*credit/total) via 128-bit mulDiv capped to cap-alloc, used==0 fallback highest credit tie idx, update temp credits c/2+1 if delta>0 else +weight, repeat. Persistent credit c/2+1 if alloc!=0 else +weight_old, dynamic weight max(1,floor(mulDiv(w,9,10))) overflow-safe else w+1 (fixes signed overflow 4e18*9=3.6e19). Burst consumption after positive batch if alloc>rate excess consumes burst_rem. Global rebalancing while remaining>0 up to 10 iter recomputing eff caps with rate remaining rate+burst_rem - batch and cost. Negative dealloc by priority desc groups then members never <0. Output T lines S CSV no spaces (simpler than T+8). Tests 48 total: 27 exact allocation batch-only (20 original burst0 cost1 +5 burst/negative +2 cost) +21 corners: min>cap, min>rate, min>rate+burst, tie/order, no members, invalid gid, blank lines/spaces/tabs, large 1e12, weight 1e24, credit 1.2e19, rate, burst, zero caps, global rebalancing 1,1,8->2,8, cost factor 3,2->16 and 4,4->20, negative -3,-1, backward compat old 5/6 and 7-field raw, deterministic 20 random, fuzz invariants 30 random. Batch-only exact for allocation makes it harder than simple but not over-scoped to timeout, aiming 20-80% sweet spot. Fixes Example6 from 2,1 to 3,2 group total 16 sub totals 6,10 matching algorithm."

