description = "Build from scratch ultimate harder hierarchical multi-batch with min, priority, rate limits, credit-decay, balanced hard-but-passable, fixes all BAD flags and adds overflow-safe. Input: T, loads, G groups prio min weight cap rate (rate 0 = unlimited per batch), S subs gid prio min weight cap rate. Effective member per-batch cap = min(rem cap, rate if >0). Sum member effective per group, effective group remaining cap = min(group rem cap, sum member eff, group rate if >0) 0 if no members. Per batch: group level allocate via min+priority+credit-decay primitive (min phase prio desc tie idx asc give = min(min,cap,rate,rem), weighted multi-round rem*credit/total capped must avoid 64-bit overflow via math/bits 128-bit Mul64/Div64, progress guarantee max credit tie lowest idx, efficient RR bulk cycles for large rem, credit update credit/2+1 if batch>0 else +weight persistent). Then per group allocate its share to members via same primitive with s_eff caps. Output T lines CSV per sub per batch precise. Explicit robustness: blank lines/spaces, invalid gid->0, group no members, min>cap capped, priority tie deterministic, zero caps, large numbers up to 1e12, large-weight 1e12*1e12=1e24 and large-credit 3*4e18=1.2e19 overflow must be overflow-safe, rate limiting 0=unlimited. Tests: 20 parametrized hierarchical multi-batch with rate limits covering effective caps with rate, min capping with rate, priority ordering, multi-round, multi-batch credit persistence, large 1e12, large-weight 1e24, large-credit 1.2e19, rate limiting + conservation + deterministic + 8 corners (min>cap, group no members, invalid gid, blank lines, large 1e12, large weight overflow, large credit overflow, rate limiting, zero caps) = 31 tests total, fixing info leakage (no paste-ready pseudocode) and spec clarity example outputs matching tests. No broken file, offline verifier via Dockerfile preinstall pytest, efficient golden handles 1e12 and overflow, trials regenerated via harbor oracle."
