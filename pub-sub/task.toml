schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Build from scratch: implement a Go program at /app/main.go that is a message broker's fan-out allocator (distribute a batch of messages across weighted, capacity-limited subscribers) using a fully-specified multi-round credit-decay weighted allocation: credit starts at weight, each round splits remaining load proportionally to credit with cap, guarantees progress via highest-credit fallback, decays served credit to credit/2+1 and accumulates unserved by +weight, with total==0 fallback to round-robin. No broken file is shipped; image starts empty. Go stdlib only; pytest builds program and drives via stdin/stdout."
keywords = ["allocation", "go", "broker", "fair-share"]

[[task.authors]]
name = "Gordon Yang"
email = "gordonyang@meta.com"

