schema_version = "1.1"

[task]
name = "codimango/pub-sub"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Build from scratch balanced hard hierarchical multi-batch with min, priority, credit-decay, fixes all quality flags. Input: T, loads, G groups prio min weight cap, S subs gid prio min weight cap, may have blank lines/spaces. Effective group remaining cap = min(group rem, sum member rem) 0 if no members explicit. Per batch: group level allocate via min+priority+credit-decay primitive (min phase prio desc tie idx asc give = min(min,cap,rem) capped min>cap, then weighted multi-round rem*credit/total capped must be computed without 64-bit overflow using math/bits 128-bit, progress guarantee max credit tie lowest idx, efficient RR bulk cycles for large rem, credit update credit/2+1 if batch>0 else +weight persistent across batches). Then per group allocate its share to members via same primitive. Output T lines CSV per sub per batch precise no spaces, 64-bit efficient. Explicit robustness: blank lines/spaces, invalid gid->0, group no members, min>cap, priority tie deterministic, zero caps, large numbers up to 1e12, large-weight and large-credit overflow where remaining*credit would overflow int64 (1e12*1e12=1e24 and 3*4e18=1.2e19) must be handled overflow-safe. Tests: 20 parametrized hierarchical multi-batch covering core plus conservation plus deterministic plus 8 corners (min_exceeds_cap, priority_tie, group_no_members, invalid_gid, blank_lines, large_numbers 1e12, large_weight_overflow 1e24, large_credit_overflow 1.2e19, zero_caps, rr_fallback) = 31 tests total, fixing README mismatch and test.sh set -e reward path, verifier offline via Dockerfile preinstall pytest, efficient golden handles 1e12 and overflow, trials regenerated from current definition to fix invalid PASS verdicts."
keywords = ["allocation", "go", "broker", "fair-share", "priority", "multi-batch"]

