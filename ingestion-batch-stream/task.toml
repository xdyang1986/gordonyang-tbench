schema_version = "1.1"

[task]
name = "codimango/ingestion-batch-stream"
description = "project description"
authors = []
keywords = []

[metadata]
difficulty = "hard"
category = "iterate_on_feature"
tags = ["iterate_on_feature"]

[verifier]
# Isolate grading from the agent so agent code can't read the oracle under
# /tests at verify time. Opt-in — uncomment to enable (also requires a tests/ env def).
# environment_mode = "separate"
timeout_sec = 600.0
# user = "nobody"  # non-root grader for in-process (Flow B) tasks; needs a root-free test.sh

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]

[[steps]]
name = "1_step_one"
dependencies = []
min_reward = 1.0

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 600.0

[[steps]]
name = "2_step_two"
dependencies = ["1_step_one"]
min_reward = 1.0
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 600.0
