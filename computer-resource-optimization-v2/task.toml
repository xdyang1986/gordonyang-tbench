schema_version = "1.1"

[task]
name = "codimango/computer-resource-optimization-v2"
description = "Exact systems behavior: Python-compatible canonical JSON checksums, lock-safe multi-process updates, strict CLI exit/output contracts, correct state movement across partitioned files. Sequencing lab fleet orchestrator for NovaSeq flowcells: 10k barcoded flowcells and 100k pipeline jobs via durable MD5-checksummed store with atomic writes; CLI reports placement, schedules with best-fit cpu waste asc → mem waste desc → gpu waste asc → id lex, throttles per-sequencer with token-bucket refill and no-consume on insufficient, tracks health via heartbeat TTL, snapshots/restores lab state including counter and config with exact token-state preservation, preserves ops-log with chronological ordering robust to 200KB lines, and defragments via optimize until no flowcell is relocatable, maintaining Turn1 --data fallback mode."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "genomics", "bioinformatics", "sequencer", "crispr", "illumina", "pacbio", "dna-pipeline"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "hard"
category = "software-engineering"
category_usecase = "resource_optimization"
category_subdomain = "scientific_computing"
