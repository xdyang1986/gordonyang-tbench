schema_version = "1.1"

[task]
name = "codimango/computer-resource-optimization-v2"
description = "HPC genomics fleet manager: Go CLI orchestrating sequencer nodes and DNA pipeline jobs under crash/burst concurrency. Turn1 361 tests extra-hard: HPC lab IDs with <>& and 🌍 emoji, 10KB barcodes, durable wrapper checksum MD5 canonical Python sort_keys, atomic rename + lock cleanup, stale tmp.12345 and lock retry, corrupt null/[]/truncated backup .corrupt.<nanosec>, jobs [] not null raw, idempotent preserves allocation, 100-way add-node/allocate stress, substring IDs node1 vs node10, max-int resources, random pagination 0= all, unicode normalization bytewise distinct, exact fit fragmentation. Turn2 72 tests: weighted MD5 sharding for sequencer throughput (weight 1/2/1/1), best-fit defrag tie-break cpu->mem->gpu->id vs first-fit, per-sequencer token-bucket 1/s burst2 multi-cycle refill 1.6s independent no-consume on insufficient, persistence/corruption, presence TTL 2s expiry unknown offline, snapshot/restore dir/file exact, ops-log skips invalid with warning, requires >=50 allocate entries (fix for previous BAD_GRADING_WRONG), optimize reduces used_nodes no overcommit."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "cluster", "resource-management", "scheduling", "sharding", "optimization", "concurrency", "distributed-systems"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "hard"
category = "software-engineering"
category_usecase = "resource_optimization"
category_subdomain = "distributed_systems"
tags = ["resource-optimization", "go", "cluster", "scheduling", "sharding", "concurrency", "presence", "rate-limiting"]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"
expert_time_estimate_min = 90.0
junior_time_estimate_min = 180.0
languages = ["go"]

