schema_version = "1.1"

[task]
name = "codimango/computer-resource-optimization-v2"
description = "Hard multi-turn Go cluster management system with real discriminators. Turn1 (30 tests) implements core cluster management with nodes, jobs, allocation, persistence integrity, atomic writes, corruption handling, concurrent safety, large scale. Turn2 (45 tests, extra-hard) adds large-scale efficiency: weighted sharding, best-fit scheduling with full tie-break cascade cpu→mem→gpu→id (discriminator vs first-fit), pagination with perf, node health heartbeat TTL expiry multi-node, per-node token bucket with multi-cycle refill 1.6s/1.2s, per-node independence, no-consume on insufficient, persistence, corruption handling, snapshot/restore dir+file exactness, ops-log invalid skipping, distribution including zeros and global broadcast, optimize fragmentation invariants (used_nodes reduction, no overcommit, preserve jobs). Config rule clarified: missing file → fallback single-file, invalid → exit2 no stdout (fixes contradiction). Failing observations pattern from pub-sub/dr-buffer: buggy skeleton shows wrong best-fit mem/gpu/id tie, rate limit shared bucket, optimize no-op."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "cluster", "resource-management", "scheduling", "sharding", "optimization", "concurrency", "distributed-systems"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "hard"
category = "software-engineering"
category_usecase = "resource_optimization"
category_subdomain = "distributed_systems"
tags = ["resource-optimization", "go", "cluster", "scheduling", "sharding", "concurrency", "presence", "rate-limiting"]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"
expert_time_estimate_min = 90.0
junior_time_estimate_min = 180.0
languages = ["go"]

