schema_version = "1.1"

[task]
name = "codimango/computer-resource-optimization-v2"
description = "Hard multi-turn Go cluster management system with real discriminators. Turn1 (49 tests, extra-hard, was 30 too easy) implements core cluster management with nodes, jobs, allocation, persistence integrity, atomic writes, corruption handling, concurrent safety, large scale. Hardened with 19 new discriminators: whitespace empty file empty store vs corrupt, missing/bad checksum corruption backup .corrupt.<nanosec>, jobs field [] not null not null after add-node/deallocate/remove-job (Go nil-slice pitfall), idempotent no-op preserves old resources/allocation not upsert, concurrent add-node 20 preserve all sorted, concurrent same node 20 preserve all 20 used correct no overcommit, concurrent diff nodes 20, pagination offset then limit order offset1 limit2 -> 1,2, invalid limit/offset, large 500 perf <2s, special chars job <>& raw SetEscapeHTML false, large ID 10KB, status sum, first-fit not best-fit (nodeA 10 CPU wins over nodeB 4 CPU for first-fit), atomic no tmp leftover. Turn2 (46 tests, extra-hard, good to keep) adds large-scale efficiency: weighted sharding, best-fit scheduling with full tie-break cascade cpu→mem→gpu→id (discriminator vs first-fit), pagination perf, node health TTL expiry multi-node, per-node token bucket multi-cycle refill 1.6s/1.2s per-node independence no-consume persistence corruption, snapshot/restore exact, ops-log skip invalid, distribution zeros global broadcast, optimize fragmentation invariants. Config rule clarified: missing -> fallback, invalid -> exit2 no stdout. Failing observations pattern for both turns."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "cluster", "resource-management", "scheduling", "sharding", "optimization", "concurrency", "distributed-systems"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

