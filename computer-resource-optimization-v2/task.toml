schema_version = "1.1"

[task]
name = "codimango/computer-resource-optimization-v2"
description = "Hard multi-turn Go cluster management system with real discriminators. Turn1 (66 tests, extra-hard, was 30 too easy, then 49 still easy) implements core cluster management with nodes, jobs, allocation, persistence integrity, atomic writes, corruption handling, concurrent safety, large scale. Hardened with 36 new discriminators over original 30: empty/whitespace empty store vs null/[]/invalid -> corrupt backup .corrupt.<nanosec> integer suffix, missing/bad checksum corruption, jobs [] not null after add-node/deallocate/remove-job (nil-slice pitfall), idempotent add-job preserves allocation running not upsert, concurrent add-node 20 sorted, concurrent same node 20 preserve all 20 used correct no overcommit valid JSON during, concurrent diff nodes 20, concurrent list while allocating, pagination offset then limit order offset1 limit2 -> 1,2 not 0,1 invalid limit/offset, large 1000 nodes perf <2s, special chars job <>& raw SetEscapeHTML false no \\u003c, large ID 10KB dash underscore dot colon valid, empty ID spaces exit2 float resource 4.0 invalid, status sum used/free correct, node jobs sorted, file lock cleaned after failure, atomic no tmp leftover, timestamp integer required (reject 1000.0 1e3 0x3e8) was missing. Turn2 (46 tests, extra-hard, good to keep) adds large-scale efficiency: weighted sharding, best-fit tie-break cpu->mem->gpu->id lex vs first-fit, pagination perf, node health TTL expiry multi-node, per-node token bucket multi-cycle refill 1.6s/1.2s per-node independence no-consume persistence corruption, snapshot/restore exact trap, ops-log skip invalid, distribution zeros global broadcast, optimize invariants. Config rule clarified missing->fallback invalid->exit2 no stdout. Failing observations pattern both turns."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "cluster", "resource-management", "scheduling", "sharding", "optimization", "concurrency", "distributed-systems"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

