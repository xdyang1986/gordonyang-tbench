[task]
name = "codimango/computer-resource-optimization-v2"
description = "Bioinformatics HPC fleet: Go CLI for Illumina NovaSeq/PacBio Revio sequencers running CRISPR L1000, FASTQ/BAM variant calling pipelines. Unique vs ci-scheduler-target-sharded/container-resource-allocator: genomics lab IDs <>& 🌍, 10KB barcodes, MD5 canonical sort_keys ensure_ascii=False raw, stale tmp.12345 cleanup, corrupt null/[]/truncated .corrupt.<nanosec>, [] not null nil-slice, idempotent keep old alloc, substring node1 vs node10, max-int 2^31-1, random pagination 0=all, unicode é vs e+combining bytewise distinct, exact fit fragmentation, 50-way alloc/dealloc stress, presence TTL, token-bucket per-sequencer 1/s burst2 refill 1.6s no-consume on insufficient, snapshot/restore dir/file exact, ops-log >=50 allocate entries (fix BAD_GRADING_WRONG), best-fit defrag cpu->mem->gpu->id lex vs first-fit."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "genomics", "hpc", "bioinformatics", "sequencer", "crispr", "illumina", "pacbio", "dna-pipeline", "resource-orchestration"]
