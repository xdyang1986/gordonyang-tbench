schema_version = "1.1"

[task]
name = "codimango/computer-resource-optimization-v2"
description = "Sequencing lab fleet orchestrator for NovaSeq flowcells: instruments stream 10k barcoded flowcells, 100k pipeline jobs flow through a durable MD5-checksummed JSON store with atomic writes; the CLI reports placement status, schedules jobs with best-fit cpu→mem→gpu→id tie-break, throttles per-sequencer allocations with token-bucket refill and no-consume on insufficient, tracks rig health via heartbeat TTL, snapshots and restores lab state, preserves an ops-log robust to 200KB lines and corrupt entries, and defragments via optimize that evacuates until no flowcell is relocatable."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "genomics", "hpc", "bioinformatics", "sequencer", "crispr", "illumina", "pacbio", "dna-pipeline", "resource-orchestration"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "hard"
category = "software-engineering"
category_usecase = "resource_optimization"
category_subdomain = "scientific_computing"
tags = ["genomics", "hpc", "bioinformatics", "sequencer", "crispr", "dna-pipeline", "resource-orchestration", "go"]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"
expert_time_estimate_min = 90.0
junior_time_estimate_min = 180.0
languages = ["go"]

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[[steps]]
name = "1_step_one"
dependencies = []
min_reward = 1.0

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1200.0

[[steps]]
name = "2_step_two"
dependencies = ["1_step_one"]
min_reward = 1.0
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1200.0
