schema_version = "1.1"

[task]
name = "codimango/computer-resource-optimization-v2"
description = "Go CLI cluster manager for genomics HPC fleet: durable MD5-checksummed JSON with atomic writes, first-fit (core) and best-fit (sharded) scheduling with cpu->mem->gpu->id lex tie-break, weighted MD5 sharding, per-node token-bucket rate limiting (allocations_per_second, burst, refill, no-consume on insufficient, persistence), presence TTL heartbeats, snapshot/restore dir+file, ops-log with invalid-line skipping and 10MB scanner, optimize defrag."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "genomics", "hpc", "bioinformatics", "sequencer", "crispr", "illumina", "pacbio", "dna-pipeline", "resource-orchestration"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "hard"
category = "software-engineering"
category_usecase = "resource_optimization"
category_subdomain = "scientific_computing"
tags = ["genomics", "hpc", "bioinformatics", "sequencer", "crispr", "dna-pipeline", "resource-orchestration", "go"]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"
expert_time_estimate_min = 90.0
junior_time_estimate_min = 180.0
languages = ["go"]

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[[steps]]
name = "1_step_one"
dependencies = []
min_reward = 1.0

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1200.0

[[steps]]
name = "2_step_two"
dependencies = ["1_step_one"]
min_reward = 1.0
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1200.0
