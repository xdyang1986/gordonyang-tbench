schema_version = "1.1"

[task]
name = "codimango/dr-buffer"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement a Go CLI that computes each region's disaster-recovery buffer under a capacity-capped single-region failure model. When a region fails, its demand is absorbed by survivors via capacity-proportional water-filling: no survivor may exceed 90% utilization, and any overflow re-spills to survivors that still have headroom; a failure whose demand cannot be absorbed 'overflows'. Report per-region worst-case incoming demand, utilization, threshold violation, DR buffer, and whether losing the region overflows the fleet."
keywords = ["go", "algorithms", "disaster-recovery", "capacity-planning", "cli"]

[[task.authors]]
name = "Gordon Yang"
email = "gordonyang@meta.com"

[metadata]

[verifier]
# Isolate grading from the agent: run the verifier in a fresh container so the
# agent's code can't read the oracle under /tests at verify time. Opt-in —
# uncomment to enable (also requires a verifier env def under tests/).
# environment_mode = "separate"
timeout_sec = 600.0
# Run the grader as a non-root user so in-process agent code (Flow B) can't read
# root-owned oracle files. Off by default because this template's test.sh uses
# apt-get (needs root); enable it when your verifier imports/runs agent code
# in-process and does not itself need root.
# user = "nobody"

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
