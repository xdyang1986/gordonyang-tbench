schema_version = "1.1"

[task]
name = "codimango/dr-buffer"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement a Go CLI whose specification must be reconstructed from a reliability policy and a post-incident review shipped in the image (/app/docs). The tool reads a messy JSON capacity report whose per-region capacity/demand each use one of three encodings and mixed units (rps, kqps, rpm), normalizes everything to rps, then under a single-region failure model redistributes the failed region's demand to survivors via capacity-capped water-filling (proportional to installed capacity, capped at 90% usable, overflow re-spilled). Reports per-region worst-case load, utilization, threshold violation, DR buffer, and whether losing the region overflows the fleet."
keywords = ["go", "algorithms", "disaster-recovery", "capacity-planning", "cli"]

[[task.authors]]
name = "Gordon Yang"
email = "gordonyang@meta.com"

[metadata]

[verifier]
# Isolate grading from the agent: run the verifier in a fresh container so the
# agent's code can't read the oracle under /tests at verify time. Opt-in —
# uncomment to enable (also requires a verifier env def under tests/).
# environment_mode = "separate"
timeout_sec = 600.0
# Run the grader as a non-root user so in-process agent code (Flow B) can't read
# root-owned oracle files. Off by default because this template's test.sh uses
# apt-get (needs root); enable it when your verifier imports/runs agent code
# in-process and does not itself need root.
# user = "nobody"

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
