schema_version = "1.1"

[task]
name = "codimango/database-failover"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Write a Go program from scratch that reads the status of a set of database replicas on stdin and decides which single replica to promote on primary failure (eligibility filtering, data-safety ordering, deterministic tie-breaking, and a no-safe-failover case), printing the decision to stdout; graded black-box on the output."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "failover", "replication", "distributed-systems"]

[metadata]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"
difficulty = "medium"
category = "software-engineering"
