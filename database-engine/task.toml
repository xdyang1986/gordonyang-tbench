schema_version = "1.1"

[task]
name = "codimango/database-engine"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Debug and fix a Go `dbctl` key-value store CLI shipped at /app/src, backed by an on-disk B+ tree. It builds and runs and handles small inputs, but two subtle localized defects in the B+ tree strand live keys once the tree grows past one node: the descend routing uses a strict `>` instead of `>=` so keys equal to a split separator become unreachable, and the leaf borrow-from-left rebalance path fails to update the parent separator after a delete. Both manifest as `get` returning not-found for keys that `scan` still lists. The agent must localize and fix both from two failing repros (no from-scratch spec to rewrite) so the hidden test suite — behavior, ordering, range semantics, cross-process persistence, node splits, delete rebalancing, and a randomized model check — passes."
keywords = ["go", "storage-engine", "key-value-store", "persistence", "cli", "b-tree"]

[[task.authors]]
name = "Gordon Yang"
email = "gordonyang@meta.com"

[metadata]
category = "software-engineering"
category_usecase = "compute_result"
category_subdomain = "distributed_systems"
difficulty = "medium"
languages = ["go"]

[verifier]
# Isolate grading from the agent: run the verifier in a fresh container so the
# agent's code can't read the oracle under /tests at verify time. Opt-in —
# uncomment to enable (also requires a verifier env def under tests/).
# environment_mode = "separate"
timeout_sec = 600.0
# Run the grader as a non-root user so in-process agent code (Flow B) can't read
# root-owned oracle files. Off by default because this template's test.sh uses
# apt-get (needs root); enable it when your verifier imports/runs agent code
# in-process and does not itself need root.
# user = "nobody"

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
