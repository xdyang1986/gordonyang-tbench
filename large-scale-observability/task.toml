schema_version = "1.1"

[task]
name = "codimango/large-scale-observability"
description = "Multi-turn Go observability HARDENED for ride-hailing (like Uber): Step1 core tracing with single-header x-ride-trace (4 parts, empty parent, Flags 1/0 consistency, ParentID==SpanContext.ParentID, nil ctx/carrier handling, Context() defensive copy, context immutability copy not reference, duplicate key last-wins not counting toward 128 limit, empty key ignored, attribute value truncate exactly 1024, event timestamp between Start/End, MemoryExporter deep copy slice+Attributes+Events+EventAttrs and Clear reuse, End idempotent exactly once via sync.Once under 50 goroutines race), metrics (defensive copy WithLabels/WithBuckets, Collect deep copy Labels non-nil and Buckets, label truncate 256 before key and reuse after truncation same prefix, label order irrelevant, Gauge Set/Add ignore NaN/Inf, Counter negative/NaN/Inf ignored, histogram buckets sorted dedup cumulative inclusive, provider isolation, type conflict first wins), logging (JSON RFC3339Nano, trace_id/span_id/sampled/parent_id correlation, With immutable sharing mutex for atomic per-line writes, level case-insensitive default info, nil handling). Skeleton now minimal panics for MemoryExporter, SimpleProcessor, Marshal/Unmarshal, MetricsProvider, Logger. Step2 hardens for large scale — RatioSampler last-8-hex uint32/2^32 with error/critical override precedence BEFORE invalid check (invalid+error=>Keep), boundary < not <= (0x80000000 at 0.5 Drop), ignores name/kind, statistical tolerance, ParentAware AND requiring parent sampled AND root Keep (OTel recall fails), Description contains root desc + Parent word, root nil fallback Always, BatchProcessor with alias WithMaxBatchSize=WithBatchSize last wins, non-positive fallback defaults 512/2048/5s/30s, BatchSize hard cap per export even on Shutdown, evict-oldest not newest with order preserved (queue2 enqueue5 => 3,4), ForceFlush block-and-drain during flush (DroppedCount 0, many concurrent block), QueueLen excludes batch never exceeds QueueSize even under concurrency, DroppedCount distinct counting not double counting same dropped label, truncation interaction reuse before cardinality, per-name limit, reuse at limit not increase dropped, aggregate overflow __overflow__ value aggregated Dropped 0, Shutdown idempotent sync.Once and concurrent with ForceFlush unblocks no deadlock, ExportTimeout via goroutine select, exporter error continues, no busy loop. Graded via 109+78 black-box Go harnesses under race."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "observability", "tracing", "metrics", "logging", "sampling", "batch", "scalability", "uber", "ride-sharing"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

