schema_version = "1.1"

[task]
name = "codimango/large-scale-observability"
description = "Multi-turn Go observability for ride-hailing (like Uber) with domain-specific contract that punishes OTel SDK recall: Step1 core tracing with single-header x-ride-trace propagation (not 4-key OTel), metrics and structured logging. Step2 hardens for large scale — RatioSampler using last-8-hex + error/critical override (OTel uses first-16-hex ignoring status), ParentAwareSampler requiring parent AND root to sample (OTel samples on parent alone), BatchProcessor evicting oldest on full queue with block-and-drain ForceFlush (OTel drops newest non-blocking). Graded via black-box Go harnesses with fixed TraceIDs where OTel recall fails."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "observability", "tracing", "metrics", "logging", "sampling", "batch", "scalability", "uber", "ride-sharing"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "hard"
category = "software-engineering"
category_usecase = "add_observability"
category_subdomain = "distributed_systems"
tags = ["iterate_on_feature", "go", "observability", "tracing", "metrics", "logging", "distributed-systems", "sampling", "scalability"]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"
expert_time_estimate_min = 90
junior_time_estimate_min = 180
languages = ["go"]
reward_type = "binary"

[environment]
