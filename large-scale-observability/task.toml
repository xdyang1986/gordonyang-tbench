schema_version = "1.1"

[task]
name = "codimango/large-scale-observability"
description = "Multi-turn Go observability for ride-hailing (like Uber): Step1 core tracing with single-header x-ride-trace propagation (traceID:spanID:parentID:sampled), metrics (counter/gauge/histogram with Collect deep copy, label truncation) and structured JSON logging with trace correlation. Step2 hardens for large scale — RatioSampler deterministic on last 8 hex chars with error/critical override (StatusError or Priority=critical always sampled), invalid TraceID => Drop, ParentAwareSampler requiring parent sampled AND root sampled, BatchProcessor with queue size limit evicting oldest on full, BatchSize hard cap per export, BatchTimeout and ExportTimeout handling, ForceFlush draining queue and blocking new spans during flush, Shutdown flushing, and metrics cardinality limiting with drop/aggregate overflow handling. Graded via black-box Go harnesses under concurrency and scale."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "observability", "tracing", "metrics", "logging", "sampling", "batch", "scalability", "uber", "ride-sharing"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "hard"
category = "software-engineering"
category_usecase = "add_observability"
category_subdomain = "distributed_systems"
tags = ["iterate_on_feature", "go", "observability", "tracing", "metrics", "logging", "distributed-systems", "sampling", "scalability"]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"
expert_time_estimate_min = 90
junior_time_estimate_min = 180
languages = ["go"]
reward_type = "binary"

[environment]
