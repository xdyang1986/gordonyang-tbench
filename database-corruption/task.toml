schema_version = "1.1"

[task]
name = "codimango/database-corruption"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Debug and fix an existing Go command-line corruption checker (`dbfsck`) for a pre-allocated append-only log file (length-prefixed key/value records, each protected by a CRC-32 IEEE checksum). A near-complete but defective implementation ships in /app/src; the agent must diagnose and repair it against the specification. The planted defects, described only by symptom in the prompt, are: (1) recovery is greedy and under-recovers when a valid record begins inside another valid record's bytes — recovering the MAXIMUM number of non-overlapping records requires a dynamic program; (2) the output file is opened before the input header is validated, so an unusable input leaves a stray/clobbered --out file instead of leaving it untouched. Record framing, CRC checking, and trailing-zero-padding accounting are already correct. Graded by building /app/src with `go build ./...` and driving the CLI over fixed and randomized binary inputs; standard library only."
keywords = ["go", "debugging", "file-format", "corruption", "crc32", "recovery", "dynamic-programming", "cli"]

[[task.authors]]
name = "Gordon Yang"
email = "gordonyang@meta.com"

[metadata]
category = "software-engineering"
category_usecase = "compute_result"
category_subdomain = "distributed_systems"
difficulty = "medium"
languages = ["go"]

[verifier]
# Isolate grading from the agent: run the verifier in a fresh container so the
# agent's code can't read the oracle under /tests at verify time. Opt-in —
# uncomment to enable (also requires a verifier env def under tests/).
# environment_mode = "separate"
timeout_sec = 600.0
# Run the grader as a non-root user so in-process agent code (Flow B) can't read
# root-owned oracle files. Off by default because this template's test.sh uses
# apt-get (needs root); enable it when your verifier imports/runs agent code
# in-process and does not itself need root.
# user = "nobody"

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
