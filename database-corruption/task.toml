schema_version = "1.1"

[task]
name = "codimango/database-corruption"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement, from scratch in Go, a command-line corruption checker (`dbfsck`) for an append-only log file with a fixed binary record format (length-prefixed key/value records, each protected by a CRC-32 IEEE checksum). The tool scans the file, reports how many records are valid, CRC-corrupt, or truncated, and — given `--out` — writes a repaired file containing only the intact records in order. It must continue past a corrupt record using the length prefix for framing, and must never crash or over-allocate on a truncated tail or a garbage length field. Graded by building /app/src with `go build ./...` and driving the CLI over fixed and randomized binary inputs; standard library only."
keywords = ["go", "file-format", "corruption", "crc32", "recovery", "cli", "binary-parsing"]

[[task.authors]]
name = "Gordon Yang"
email = "gordonyang@meta.com"

[metadata]
category = "software-engineering"
category_usecase = "compute_result"
category_subdomain = "distributed_systems"
difficulty = "medium"
languages = ["go"]

[verifier]
# Isolate grading from the agent: run the verifier in a fresh container so the
# agent's code can't read the oracle under /tests at verify time. Opt-in —
# uncomment to enable (also requires a verifier env def under tests/).
# environment_mode = "separate"
timeout_sec = 600.0
# Run the grader as a non-root user so in-process agent code (Flow B) can't read
# root-owned oracle files. Off by default because this template's test.sh uses
# apt-get (needs root); enable it when your verifier imports/runs agent code
# in-process and does not itself need root.
# user = "nobody"

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
