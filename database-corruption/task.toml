schema_version = "1.1"

[task]
name = "codimango/database-corruption"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Implement, from scratch in Go, a command-line corruption checker (`dbfsck`) for a pre-allocated append-only log file with a fixed binary record format (length-prefixed key/value records, each protected by a CRC-32 IEEE checksum). Several requirements are stated only implicitly and separate a careful solution from a rushed one: (1) recover the MAXIMUM number of non-overlapping valid records — because a valid record can begin inside another valid record's bytes, greedy recovery is not optimal and a dynamic program is needed; (2) a trailing run of zero bytes is pre-allocated free space, not corruption, so it is excluded from the skipped count (while zero gaps between records are corruption, and a record whose value ends in 0x00 must not be trimmed); (3) on an unusable input the tool writes nothing and leaves any pre-existing --out untouched, and in-place repair (--in == --out) must read the input fully before writing; (4) the magic bytes are meaningful only in the 8-byte header — 'DBLG' inside a record value or a damaged region is ordinary data, since recovery is by CRC/length framing, not by scanning for magic; (5) records may start at any byte offset and an oversized length field must never crash or over-allocate. It reports {recovered, skipped} and, given `--out`, writes a repaired file of the recovered records in order. Graded by building /app/src with `go build ./...` and driving the CLI over fixed and randomized binary inputs; standard library only."
keywords = ["go", "file-format", "corruption", "crc32", "recovery", "dynamic-programming", "cli", "binary-parsing"]

[[task.authors]]
name = "Gordon Yang"
email = "gordonyang@meta.com"

[metadata]
category = "software-engineering"
category_usecase = "compute_result"
category_subdomain = "distributed_systems"
difficulty = "medium"
languages = ["go"]

[verifier]
# Isolate grading from the agent: run the verifier in a fresh container so the
# agent's code can't read the oracle under /tests at verify time. Opt-in —
# uncomment to enable (also requires a verifier env def under tests/).
# environment_mode = "separate"
timeout_sec = 600.0
# Run the grader as a non-root user so in-process agent code (Flow B) can't read
# root-owned oracle files. Off by default because this template's test.sh uses
# apt-get (needs root); enable it when your verifier imports/runs agent code
# in-process and does not itself need root.
# user = "nobody"

[agent]
timeout_sec = 600.0

