schema_version = "1.1"

[task]
name = "codimango/unified-routing"
description = "Stateful provider-routing CLI: per-file capacity exhaustion, tenant budgets, priority-weighted strategy scoring, region affinity, static-health scoring, multi-level tie-breaking, and region-diverse failover chains."
authors = []
keywords = ["routing","cloud","api","load-balancing","failover","capacity","tenant","budget","sla"]

[metadata]

[verifier]
# Isolate grading from the agent: run the verifier in a fresh container so the
# agent's code can't read the oracle under /tests at verify time. Opt-in —
# uncomment to enable (also requires a verifier env def under tests/).
# environment_mode = "separate"
timeout_sec = 600.0
# Run the grader as a non-root user so in-process agent code (Flow B) can't read
# root-owned oracle files. Off by default because this template's test.sh uses
# apt-get (needs root); enable it when your verifier imports/runs agent code
# in-process and does not itself need root.
# user = "nobody"

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
