schema_version = "1.1"

[task]
name = "codimango/unified-routing"
format = "terminal_bench_single_turn"
workstream = "swe_public_repo"
description = "Extreme concurrency Go router with dynamic membership, Release, AddProvider bool, RemoveProvider, atomic BatchRoute, blocking WaitRoute with context and cond var, Snapshot consistent copy, Close lifecycle idempotent wakeup. Largest-remaining policy. Must be race-free deadlock-free no lost wakeup snapshot-consistent performant RWMutex under mixed workload. Graded go test -race -count=20."
keywords = ["go","concurrency","race-detector","mutex","rwmutex","condvar","synchronization","routing","capacity","atomic-batch","dynamic-membership","blocking","snapshot","close-lifecycle","context-cancellation"]

[[task.authors]]
name = "Gordon Yang"
email = "gordonyang@meta.com"

[metadata]
category = "software-engineering"
category_usecase = "compute_result"
category_subdomain = "distributed_systems"
difficulty = "hard"
languages = ["go"]

[verifier]
# Isolate grading from the agent: run the verifier in a fresh container so the
# agent's code can't read the oracle under /tests at verify time. Opt-in —
# uncomment to enable (also requires a verifier env def under tests/).
# environment_mode = "separate"
timeout_sec = 600.0
# Run the grader as a non-root user so in-process agent code (Flow B) can't read
# root-owned oracle files. Off by default because this template's test.sh uses
# apt-get (needs root); enable it when your verifier imports/runs agent code
# in-process and does not itself need root.
# user = "nobody"

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
