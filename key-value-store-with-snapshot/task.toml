schema_version = "1.1"

[task]
name = "codimango/key-value-store-with-snapshot"
description = "Implement an in-process distributed key/value store in C# (.NET 8): N replica nodes with a configured leader, synchronous quorum writes, versioned tombstones, manual epoch-bump failover, and Settle-driven anti-entropy convergence."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["csharp", "dotnet", "distributed-systems", "replication", "consensus", "quorum"]

[metadata]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"
difficulty = "hard"
category = "software-engineering"
category_usecase = "coordinate_execution"
category_subdomain = "distributed_systems"
languages = ["csharp"]
tags = ["csharp", "dotnet", "distributed-systems", "replication", "quorum", "consensus"]
expert_time_estimate_min = 45.0
junior_time_estimate_min = 120.0

[verifier]
# Verify in the agent's own container: it already has the .NET SDK and the agent's
# implementation under /app. Test files are copied in only at verification time, so
# the agent never sees them during its run. Test-only frameworks restore from NuGet
# at verification time (allow_internet = true).
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
