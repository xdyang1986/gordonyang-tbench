schema_version = "1.1"

[task]
name = "codimango/file-analysis"
description = "Multi-turn Go file relevance analyzer: Step1 builds a CLI to classify files as business-critical, PII, or non-essential via keyword and regex heuristics. Step2 improves efficiency with worker-pool concurrency and accuracy with Luhn validation, SSN invalidation, extension-aware and log-pattern heuristics, binary detection, weighted business scoring, and confidence/reasons output."
authors = [{ name = "Gordon Yang", email = "gordonyang@meta.com" }]
keywords = ["go", "file-analysis", "classification", "pii", "business-critical", "concurrency", "luhn", "efficiency"]
format = "terminal_bench_multi_turn"
workstream = "swe_public_repo"

[metadata]
difficulty = "hard"
category = "software-engineering"
category_usecase = "implement_new_feature"
category_subdomain = "security_and_privacy"
reward_type = "binary"
tags = ["iterate_on_feature", "go", "file-analysis", "pii", "classification", "concurrency", "security"]
author_name = "Gordon Yang"
author_email = "gordonyang@meta.com"
expert_time_estimate_min = 45
junior_time_estimate_min = 120
languages = ["go"]

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[[steps]]
name = "1_step_one"
dependencies = []
min_reward = 1.0

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1800.0

[[steps]]
name = "2_step_two"
dependencies = ["1_step_one"]
min_reward = 1.0
inherit_prior_session = true

[steps.verifier]
timeout_sec = 600.0

[steps.agent]
timeout_sec = 1800.0
